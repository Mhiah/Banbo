[package]
name = "banbo"
version = "0.1.0"
edition = "2021"
description = "NEAR vault that lets AI agents spend under contract-enforced limits"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Measurement-only build: exposes `probe_tee_verify` to time Intel quote
# verification on a real node. Never deployed.
tee-gas-probe = []

[dependencies]
near-sdk = "5.30.0"
dcap-qvl = { version = "=0.5.2", default-features = false, features = ["contract", "borsh", "std", "ring", "default-x509"] }
sha2 = "0.10"
hex = "0.4"

# ring/x509 pull in getrandom; NEAR contracts have no OS randomness, and
# quote verification never needs it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
