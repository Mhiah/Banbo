[package]
name = "mock-ft"
version = "0.1.0"
edition = "2021"
description = "Test-only NEP-141 token (stands in for USDC on the local sandbox)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
